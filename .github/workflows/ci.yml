# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master-dev ]

jobs:
  build:
    if: github.repository == 'HuaweiCloudDeveloper/gaussdb-flink-connector-jdbc'
    runs-on: ubuntu-latest
    environment: gaussdb-flink-connector-jdbc-build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
          
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Deploy to GitHub Packages
        run: mvn -B clean deploy -Dspotless.check.skip=true -Dcheckstyle.skip=true -s settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}   
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}